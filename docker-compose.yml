version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voucher-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voucher_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voucher-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/voucher_db?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voucher-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
